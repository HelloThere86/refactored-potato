{% extends 'base.html' %}

{% block content %}
<h1 class="panel-title">Record a customer payment</h1>
<p class="form-lede">Use this when a customer pays money towards what they owe.</p>

{% if customers %}
<div class="form-sheet">
  <form method="POST">
    <div class="mb-3">
      <label class="form-label" for="customer_id">Which customer is paying?</label>
      <select id="customer_id" name="customer_id" class="form-select form-select-lg" required>
        <option value="">Choose a customer</option>
        {% for c in customers %}
          <option value="{{ c.id }}">{{ c.name }} (owes ${{ "{:,.2f}".format(c.balance) }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label" for="amount">Amount paid</label>
      <div class="input-group input-group-lg">
        <span class="input-group-text">$</span>
        <input type="number" step="0.01" min="0" id="amount" name="amount" class="form-control" required>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="notes">Payment method or notes <span class="optional">(optional)</span></label>
      <input type="text" id="notes" name="notes" class="form-control" placeholder="For example, cash, bank transfer, Ecocash">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn-lg">Save payment</button>
    </div>
  </form>
</div>
{% else %}
<p class="empty-note">No customers yet. <a href="/settings">Add one in Settings</a>, then you can record their payments.</p>
{% endif %}
{% endblock %}
