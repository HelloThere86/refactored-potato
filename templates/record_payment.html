{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm border-0 mx-auto" style="max-width: 600px;">
    <div class="card-body p-5">
        <h2 class="mb-4 text-success">💵 Record Customer Payment</h2>
        <p class="text-muted mb-4">Use this when a customer pays money towards their outstanding account.</p>
        
        <form method="POST">
            <div class="mb-4">
                <label class="form-label fw-bold">Which customer is paying?</label>
                <select name="customer_id" class="form-select form-select-lg" required>
                    <option value="">Select a Customer...</option>
                    {% for c in customers %}
                        <option value="{{ c.id }}">
                            {{ c.name }} (Owes: ${{ "%.2f"|format(c.balance) }})
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-4 bg-light p-3 rounded border">
                <label class="form-label fw-bold">Amount Paid ($)</label>
                <input type="number" step="0.01" name="amount" class="form-control form-control-lg" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold">Notes / Payment Method (Optional)</label>
                <input type="text" name="notes" class="form-control" placeholder="e.g., Cash, Bank Transfer, Ecocash">
            </div>
            
            <button type="submit" class="btn btn-success btn-lg w-100">Save Payment</button>
        </form>
    </div>
</div>
{% endblock %}
