{% extends 'base.html' %}

{% block content %}
<h1 class="panel-title">Edit customer</h1>

<div class="form-sheet">
  <form method="POST">
    <div class="mb-3">
      <label class="form-label" for="name">Name</label>
      <input type="text" id="name" name="name" class="form-control form-control-lg" value="{{ customer.name }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label" for="phone">Phone number</label>
      <input type="tel" id="phone" name="phone" class="form-control" value="{{ customer.phone or '' }}">
    </div>

    <div class="mb-3">
      <label class="form-label" for="location">Location or address</label>
      <input type="text" id="location" name="location" class="form-control" value="{{ customer.location or '' }}">
    </div>

    <div class="mb-3">
      <label class="form-label" for="notes">Notes</label>
      <textarea id="notes" name="notes" class="form-control" rows="3">{{ customer.notes or '' }}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn-lg">Save changes</button>
      <a href="/settings" class="btn btn-outline-secondary btn-lg">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
