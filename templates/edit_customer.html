{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm border-0 mx-auto" style="max-width: 600px;">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0">✏️ Edit Customer</h4>
    </div>
    <div class="card-body p-4">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Customer Name *</label>
                <!-- Notice we pre-fill the value="" with the customer's existing data -->
                <input type="text" name="name" class="form-control form-control-lg" value="{{ customer.name }}" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Phone Number</label>
                <input type="text" name="phone" class="form-control" value="{{ customer.phone or '' }}">
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Location / Address</label>
                <input type="text" name="location" class="form-control" value="{{ customer.location or '' }}">
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold">Notes</label>
                <textarea name="notes" class="form-control" rows="3">{{ customer.notes or '' }}</textarea>
            </div>
            
            <div class="d-flex justify-content-between mt-4">
                <a href="/settings" class="btn btn-outline-secondary btn-lg px-4">Cancel</a>
                <button type="submit" class="btn btn-primary btn-lg px-5">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
