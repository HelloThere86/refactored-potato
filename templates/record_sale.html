{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm border-0 mx-auto" style="max-width: 600px;">
    <div class="card-body p-5">
        <h2 class="mb-4">➕ Record a Sale</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Who is the customer?</label>
                <select name="customer_id" class="form-select form-select-lg" required>
                    <option value="">Select a Customer...</option>
                    {% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">What did they buy?</label>
                <select name="unit_id" class="form-select form-select-lg" required>
                    {% for u in units %}<option value="{{ u.id }}">{{ u.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label fw-bold">Quantity</label>
                    <input type="number" step="0.01" name="quantity" class="form-control form-control-lg" required>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label fw-bold">Price per unit ($)</label>
                    <input type="number" step="0.01" name="unit_price" class="form-control form-control-lg" required>
                </div>
            </div>
            <div class="mb-4 p-3 bg-light rounded">
                <label class="form-label fw-bold">How much did they pay right now? ($)</label>
                <input type="number" step="0.01" name="amount_paid" class="form-control form-control-lg" value="0" required>
                <small class="text-muted">Leave as 0 if this is entirely on credit.</small>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Notes (Optional)</label>
                <input type="text" name="notes" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Save Sale</button>
        </form>
    </div>
</div>
{% endblock %}
