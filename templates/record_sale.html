{% extends 'base.html' %}

{% block content %}
<h1 class="panel-title">Record a sale</h1>

{% if customers and units %}
<div class="form-sheet">
  <form method="POST">
    <div class="mb-3">
      <label class="form-label" for="customer_id">Who is the customer?</label>
      <select id="customer_id" name="customer_id" class="form-select form-select-lg" required>
        <option value="">Choose a customer</option>
        {% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label" for="unit_id">What did they buy?</label>
      <select id="unit_id" name="unit_id" class="form-select form-select-lg" required>
        <option value="">Choose a product</option>
        {% for u in units %}<option value="{{ u.id }}">{{ u.name }}</option>{% endfor %}
      </select>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-6">
        <label class="form-label" for="quantity">Quantity</label>
        <input type="number" step="0.01" min="0" id="quantity" name="quantity" class="form-control form-control-lg" required>
      </div>
      <div class="col-6">
        <label class="form-label" for="unit_price">Price per unit</label>
        <div class="input-group input-group-lg">
          <span class="input-group-text">$</span>
          <input type="number" step="0.01" min="0" id="unit_price" name="unit_price" class="form-control" required>
        </div>
      </div>
    </div>

    <div class="form-section">
      <label class="form-label" for="amount_paid">How much did they pay right now?</label>
      <div class="input-group input-group-lg">
        <span class="input-group-text">$</span>
        <input type="number" step="0.01" min="0" id="amount_paid" name="amount_paid" class="form-control" value="0" required aria-describedby="paid-help">
      </div>
      <div id="paid-help" class="form-text mt-2">Leave as 0 if this is entirely on credit.</div>
    </div>

    <div class="mt-3">
      <label class="form-label" for="notes">Notes <span class="optional">(optional)</span></label>
      <input type="text" id="notes" name="notes" class="form-control">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn-lg">Save sale</button>
    </div>
  </form>
</div>
{% else %}
<p class="empty-note">
  To record a sale you need at least one customer and one product.
  <a href="/settings">Add them in Settings</a>.
</p>
{% endif %}
{% endblock %}
