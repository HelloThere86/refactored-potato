{% extends 'base.html' %}

{% block content %}
<h1 class="panel-title">Record an expense</h1>

<div class="form-sheet">
  <form method="POST">
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label" for="amount">Amount spent</label>
        <div class="input-group input-group-lg">
          <span class="input-group-text">$</span>
          <input type="number" step="0.01" min="0" id="amount" name="amount" class="form-control" required>
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="category">Category</label>
        <select id="category" name="category" class="form-select form-select-lg" required>
          <option value="">Choose a category</option>
          {% for cat in categories %}
            <option value="{{ cat }}">{{ cat }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="description">What was this for?</label>
      <input type="text" id="description" name="description" class="form-control" placeholder="For example, 2 bags of Compound D" required>
    </div>

    <fieldset class="choice-group form-section">
      <legend>What is this expense for?</legend>

      <div class="choice">
        <input type="radio" name="scope" value="specific" id="scopeSpecific" onchange="toggleScopeUI()" checked>
        <label for="scopeSpecific">
          <span class="choice-title">One product</span>
          <span class="choice-desc">Applies to a single crop or product</span>
        </label>
      </div>
      <div id="uiSpecific" class="choice-detail">
        <label class="form-label" for="single_unit_id">Which product?</label>
        <select id="single_unit_id" name="single_unit_id" class="form-select">
          {% for u in units %}<option value="{{ u.id }}">{{ u.name }}</option>{% endfor %}
        </select>
      </div>

      <div class="choice">
        <input type="radio" name="scope" value="shared" id="scopeShared" onchange="toggleScopeUI()">
        <label for="scopeShared">
          <span class="choice-title">A few products</span>
          <span class="choice-desc">Shared among the products you pick</span>
        </label>
      </div>
      <div id="uiShared" class="choice-detail" style="display:none;">
        <span class="checklist-label">Select all that apply</span>
        <div class="checklist">
          {% for u in units %}
          <div class="choice">
            <input type="checkbox" name="shared_unit_ids" value="{{ u.id }}" id="chk_{{ u.id }}">
            <label for="chk_{{ u.id }}">{{ u.name }}</label>
          </div>
          {% endfor %}
        </div>
      </div>

      <div class="choice">
        <input type="radio" name="scope" value="farm" id="scopeFarm" onchange="toggleScopeUI()">
        <label for="scopeFarm">
          <span class="choice-title">Entire farm</span>
          <span class="choice-desc">General maintenance or shared resources</span>
        </label>
      </div>

      <div class="choice">
        <input type="radio" name="scope" value="unallocated" id="scopeUnallocated" onchange="toggleScopeUI()">
        <label for="scopeUnallocated">
          <span class="choice-title">Not sure yet</span>
          <span class="choice-desc">You can assign it later</span>
        </label>
      </div>
    </fieldset>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn-lg">Save expense</button>
    </div>
  </form>
</div>

<script>
function toggleScopeUI() {
    const scope = document.querySelector('input[name="scope"]:checked').value;
    document.getElementById('uiSpecific').style.display = (scope === 'specific') ? 'block' : 'none';
    document.getElementById('uiShared').style.display = (scope === 'shared') ? 'block' : 'none';
}
</script>
{% endblock %}
