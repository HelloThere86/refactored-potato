{% extends 'base.html' %}

{% block content %}
<h1 class="panel-title">Record an expense</h1>

<div class="form-sheet">
  <form method="POST">
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label" for="amount">Amount spent</label>
        <div class="input-group input-group-lg">
          <span class="input-group-text">$</span>
          <input type="number" step="0.01" min="0" id="amount" name="amount" class="form-control" required>
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="category">Category</label>
        <select id="category" name="category" class="form-select form-select-lg" required>
          <option value="">Choose a category</option>
          {% for cat in categories %}
            <option value="{{ cat }}">{{ cat }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="description">What was this for?</label>
      <input type="text" id="description" name="description" class="form-control" placeholder="For example, 2 bags of Compound D" required>
    </div>

    <div class="form-section">
      <label class="form-label" for="unit_id">Which product is this for?</label>
      <select id="unit_id" name="unit_id" class="form-select form-select-lg" aria-describedby="unit-help">
        <option value="shared">Shared farm expense</option>
        {% for u in units %}
          <option value="{{ u.id }}">{{ u.name }} only</option>
        {% endfor %}
      </select>
      <div id="unit-help" class="form-text mt-2">
        Choose a product if the expense belongs to it alone, such as fertilizer for Fancy Lettuce. Leave it on shared for costs like diesel or electricity.
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn-lg">Save expense</button>
    </div>
  </form>
</div>
{% endblock %}
