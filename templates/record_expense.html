{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm border-0 mx-auto" style="max-width: 650px;">
    <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Record an Expense</h4>
    </div>
    <div class="card-body p-4">
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Amount Spent ($)</label>
                    <input type="number" step="0.01" name="amount" class="form-control form-control-lg" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Category</label>
                    <select name="category" class="form-select form-select-lg" required>
                        <option value="">Select...</option>
                        {% for cat in categories %}<option value="{{ cat }}">{{ cat }}</option>{% endfor %}
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Description</label>
                <input type="text" name="description" class="form-control" placeholder="e.g., Bought 2 bags of Compound D" required>
            </div>

            <!-- V1.2 Scope Selection -->
            <div class="mb-4 p-3 bg-light rounded border">
                <label class="form-label fw-bold d-block mb-3">What is this expense for?</label>
                
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="scope" value="specific" id="scopeSpecific" onchange="toggleScopeUI()" checked>
                    <label class="form-check-label" for="scopeSpecific"><strong>Specific Business</strong> (Applies to only one crop/product)</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="scope" value="shared" id="scopeShared" onchange="toggleScopeUI()">
                    <label class="form-check-label" for="scopeShared"><strong>Selected Businesses</strong> (Shared among specific crops/products)</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="scope" value="farm" id="scopeFarm" onchange="toggleScopeUI()">
                    <label class="form-check-label" for="scopeFarm"><strong>Entire Farm</strong> (General farm maintenance, shared resources)</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="scope" value="unallocated" id="scopeUnallocated" onchange="toggleScopeUI()">
                    <label class="form-check-label" for="scopeUnallocated"><strong>Unallocated</strong> (I don't know yet)</label>
                </div>

                <!-- Specific UI -->
                <div id="uiSpecific" class="mt-3 pt-3 border-top">
                    <select name="single_unit_id" class="form-select">
                        {% for u in units %}<option value="{{ u.id }}">{{ u.name }}</option>{% endfor %}
                    </select>
                </div>
                
                <!-- Shared UI -->
                <div id="uiShared" class="mt-3 pt-3 border-top" style="display:none;">
                    <label class="small text-muted mb-2">Select all that apply:</label>
                    <div style="max-height: 150px; overflow-y: auto;" class="p-2 border bg-white rounded">
                        {% for u in units %}
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="shared_unit_ids" value="{{ u.id }}" id="chk_{{ u.id }}">
                            <label class="form-check-label" for="chk_{{ u.id }}">{{ u.name }}</label>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-100">Save Expense</button>
        </form>
    </div>
</div>

<script>
function toggleScopeUI() {
    const scope = document.querySelector('input[name="scope"]:checked').value;
    document.getElementById('uiSpecific').style.display = (scope === 'specific') ? 'block' : 'none';
    document.getElementById('uiShared').style.display = (scope === 'shared') ? 'block' : 'none';
}
</script>
{% endblock %}
